<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IXT | I excel in Technology</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #060913;
            color: #f8fafc;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation - Glassmorphism */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 10%;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
        }
        .logo span {
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-btn, .nav-btn-link {
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background-color: rgba(56, 189, 248, 0.05);
            cursor: pointer;
        }
        .nav-btn:hover, .nav-btn-link:hover {
            background-color: #38bdf8;
            color: #060913;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            transform: translateY(-2px);
        }

        /* Hero Section - Glowing Tech Background */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 75vh;
            padding: 2rem 10%;
            background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #060913 70%);
            position: relative;
        }
        .hero::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(56, 189, 248, 0.1);
            filter: blur(120px);
            border-radius: 50%;
            z-index: 0;
        }
        .hero h1, .hero p, .hero button {
            position: relative;
            z-index: 1;
        }
        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .hero p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 650px;
            margin-bottom: 2.5rem;
        }

        /* Content Section */
        .content-section {
            display: none;
            padding: 5rem 10%;
            background-color: #060913;
            min-height: 70vh;
        }
        .content-container {
            max-width: 850px;
            margin: 0 auto;
            background: linear-gradient(145deg, #0f172a, #0b1329);
            padding: 4rem 3rem;
            border-radius: 20px;
            border: 1px solid rgba(56, 189, 248, 0.25);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.1);
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
